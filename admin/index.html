<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – WhatsApp Cloud</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔐 ADMIN PASSWORD PROTECTION (ONE-TIME LOGIN) -->
<script>
  const ADMIN_PASSWORD = "ansh@automation";
  const LOGIN_KEY = "admin_logged_in";

  if (localStorage.getItem(LOGIN_KEY) !== "true") {
    const entered = prompt("🔐 Enter Admin Password:");

    if (entered === ADMIN_PASSWORD) {
      localStorage.setItem(LOGIN_KEY, "true");
    } else {
      alert("❌ Wrong password");
      window.location.href = "/";
    }
  }

  function logoutAdmin() {
    localStorage.removeItem(LOGIN_KEY);
    alert("Logged out successfully");
    location.reload();
  }
</script>

<div class="container">

  <!-- HEADER -->
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>📊 WhatsApp Admin Dashboard</h1>
    <button onclick="logoutAdmin()" style="
      padding:8px 14px;
      background:#ff4d4d;
      color:#fff;
      border:none;
      border-radius:6px;
      cursor:pointer;
    ">
      Logout
    </button>
  </div>

  <!-- STATS -->
  <div class="cards">
    <div class="card">
      Total Leads<br>
      <span id="totalLeads">0</span>
    </div>

    <div class="card">
      Today Leads<br>
      <span id="todayLeads">0</span>
    </div>

    <div class="card">
      Active Bots<br>
      <span>1</span>
    </div>
  </div>

  <!-- TABLE -->
  <h2>Recent Leads</h2>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>User Number</th>
          <th>Message</th>
          <th>Lead Type</th>
        </tr>
      </thead>
      <tbody id="leadTable">
        <!-- JS injects rows -->
      </tbody>
    </table>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
