<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – WhatsApp Cloud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📊 WhatsApp Admin Dashboard</h1>

    <div class="cards">
      <div class="card">Total Leads<br><span>--</span></div>
      <div class="card">Today Leads<br><span>--</span></div>
      <div class="card">Active Bots<br><span>1</span></div>
    </div>

    <h2>Recent Leads</h2>

    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>User Number</th>
          <th>Message</th>
          <th>Lead Type</th>
        </tr>
      </thead>
      <tbody id="leadTable">
        <tr>
          <td>--</td>
          <td>--</td>
          <td>--</td>
          <td>--</td>
        </tr>
      </tbody>
    </table>
  </div>

<script src="script.js"></script>
</body>
</html>
